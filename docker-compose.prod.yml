# Переопределения для сервера. Подключается вместе с основным файлом:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# (или COMPOSE_FILE=docker-compose.yml:docker-compose.prod.yml в .env — тогда хватит `docker compose ...`).
services:
  db:
    # На сервере порт Postgres наружу не нужен вообще (бэкап делается через `docker compose exec`).
    ports: !reset []

  caddy:
    # Настоящий сертификат Let's Encrypt: Caddy нужен 80 (проверка ACME + редирект) и 443.
    ports: !override
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?задайте DOMAIN в .env}
      ACME_EMAIL: ${ACME_EMAIL:?задайте ACME_EMAIL в .env}
    volumes: !override
      - ./docker/Caddyfile.prod:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    # Локальная проверка через https://localhost/healthz тут не сработает (сертификат на домен) —
    # проверяем, что жив admin API Caddy внутри контейнера.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]

volumes:
  caddy_config:
