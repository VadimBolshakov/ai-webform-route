# CI: the same checks as scripts/check.ps1, plus the backup scripts bench (tests/test_ops_backup.py).
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aichat
          POSTGRES_PASSWORD: aichat
          POSTGRES_DB: aichat_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aichat -d aichat_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://aichat:aichat@127.0.0.1:5432/aichat_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install dependencies
        run: python -m pip install -e ".[dev]"
      - name: Ruff
        run: python -m ruff check .
      - name: Pytest (without the Docker bench)
        run: python -m pytest -q -W error -m "not docker"
      - name: pip-audit
        run: python -m pip_audit
      - name: ShellCheck
        run: >-
          docker run --rm -v "$PWD:/mnt" -w /mnt koalaman/shellcheck:v0.11.0
          ops/backup/*.sh ops/backup/test/run.sh

  backup-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install dependencies
        run: python -m pip install -e ".[dev]"
      - name: Backup scripts bench
        # A skip (e.g. Docker unavailable) must fail the job instead of passing silently.
        # shell: bash adds pipefail, so a pytest failure is not masked by tee.
        shell: bash
        run: |
          python -m pytest -W error -m docker -rs | tee pytest.log
          if grep -q SKIPPED pytest.log; then echo "::error::the backup bench was skipped"; exit 1; fi
