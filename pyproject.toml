[project]
name = "aichat"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "sqlalchemy[asyncio]==2.0.36",
    "asyncpg==0.30.0",
    "pydantic-settings==2.7.0",
    "cryptography==44.0.0",
    "jinja2==3.1.5",
    "alembic==1.14.0",
    "argon2-cffi==23.1.0",
    "pyotp==2.9.0",
    "segno==1.6.1",
    "python-multipart==0.0.20",
    "pypdf==6.21.1",
    "python-docx==1.2.0",
    "Pillow==13.0.0",
    "httpx==0.28.1",
    "apscheduler==3.11.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==1.2.0",
    "respx==0.23.1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.security" = ["breached.txt"]
"app.web" = ["templates/**", "static/**"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
