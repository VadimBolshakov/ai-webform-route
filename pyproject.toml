[project]
name = "aichat"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.143.3",
    "starlette==1.8.0",
    "uvicorn[standard]==0.34.0",
    "sqlalchemy[asyncio]==2.0.36",
    "asyncpg==0.30.0",
    "pydantic-settings==2.7.0",
    "cryptography==50.0.2",
    "jinja2==3.1.6",
    "alembic==1.14.0",
    "argon2-cffi==23.1.0",
    "pyotp==2.9.0",
    "segno==1.6.1",
    "python-multipart==0.0.32",
    "pypdf==6.21.1",
    "python-docx==1.2.0",
    "Pillow==13.0.0",
    "httpx==0.28.1",
    "apscheduler==3.11.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "respx==0.23.1",
    "ruff==0.17.1",
    "pip-audit==2.10.1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.security" = ["breached.txt"]
"app.web" = ["templates/**", "static/**"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Form", "fastapi.File"]
